    background-position:center;
    background-repeat:no-repeat;
    opacity:0.22;
    mix-blend-mode:overlay;
    pointer-events:none;
  }
  .glow{
    position:absolute;
    top:50%; left:50%;
    width:900px; height:900px;
    transform:translate(-50%,-50%);
    background:radial-gradient(circle, rgba(255,215,0,0.10) 0%, transparent 70%);
    pointer-events:none;
  }
  .content{
    position:relative;
    z-index:2;
    max-width:720px;
  }
  .eyebrow{
    font-size:.85rem;
    letter-spacing:.15em;
    text-transform:uppercase;
    color:var(--gold);
    font-weight:700;
    margin-bottom:1.5rem;
  }
  .eyebrow::before, .eyebrow::after{ content:"✦"; margin:0 .6em; }
  h1{
    font-family:'Playfair Display',serif;
    font-weight:900;
    font-size:clamp(2.4rem, 6.5vw, 4.4rem);
    line-height:1.15;
    color:#FFFFFF;
    margin-bottom:.5rem;
    text-shadow:0 2px 20px rgba(0,0,0,.6);
  }
  h1 em{
    font-style:italic;
    color:var(--gold-light);
    display:block;
  }
  .sub{
    font-family:'Lato',sans-serif;
    font-weight:700;
    font-size:clamp(1.15rem, 3vw, 1.6rem);
    color:#FFFFFF;
    margin:1.8rem 0 2.4rem;
    line-height:1.7;
    text-shadow:0 2px 16px rgba(0,0,0,.6);
  }
  .back-badge{
    display:inline-block;
    background:var(--gold);
    color:#111;
    font-weight:900;
    font-family:'Playfair Display',serif;
    font-size:1.05rem;
    padding:.9rem 2rem;
    border-radius:3px;
    letter-spacing:.03em;
    margin-bottom:2.5rem;
  }
  .divider{
    width:80px;
    height:1px;
    background:rgba(255,215,0,.4);
    margin:0 auto 2.2rem;
  }
  .contact{
    font-size:.95rem;
    color:rgba(240,240,240,.65);
    line-height:1.9;
  }
  .contact strong{ color:var(--gold-light); font-weight:700; }
  .contact a{ color:var(--gold-light); text-decoration:none; }
  .contact a:hover{ text-decoration:underline; }
  @media (max-width:480px){
    .glow{width:600px;height:600px;}
  }

    </p>
  </div>
</body>
